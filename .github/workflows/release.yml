name: Release

# Push a tag like v1.0.1 to publish a release. HACS then offers it as an update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag into manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" custom_components/pumpwatch/manifest.json
      - name: Zip integration
        run: cd custom_components/pumpwatch && zip -r ../../pumpwatch.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: pumpwatch.zip
          generate_release_notes: true
